global:
  scrape_interval: 1s
  evaluation_interval: 1s
  scrape_timeout: 1s

scrape_configs:
  - job_name: scoring
    static_configs:
      - targets: ['fraud_detector:8000']
  - job_name: writer
    static_configs:
      - targets: ['scoring_writer:8001']
  - job_name: host
    static_configs:
      - targets: ['node-exporter:9100']
